; Ori firmware — PlatformIO project
; Target: Waveshare ESP32-S3 Touch LCD 4.3" (ESP32-S3, 16 MB flash, 8 MB PSRAM).
; Framework: Arduino ONLY. Do not add ESP-IDF APIs.

[platformio]
default_envs = ori

[env:ori]
; pioarduino fork ships Arduino-ESP32 3.x, required by Arduino_GFX 1.5+ which
; in turn unlocks the bounce_buffer_size_px parameter on Arduino_ESP32RGBPanel.
; That parameter is the canonical fix for the PSRAM-bandwidth color artifacts
; (G-channel mid-tone loss, left-edge pixel noise) seen on this Waveshare board.
platform           = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board              = esp32-s3-devkitc-1
framework          = arduino
monitor_speed      = 115200
upload_speed       = 921600

; 16 MB flash, OPI PSRAM (8 MB), Arduino-on-S3 with PSRAM enabled.
board_build.flash_size           = 16MB
board_upload.flash_size          = 16MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = partitions.csv

build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  ; M4 debug: serial key cycler — press '?' in the serial monitor for the keymap.
  ; Shares the USB CDC port with the OTA receiver, so screen_manager::poll_serial
  ; is gated off whenever an OTA is active/mid-frame (ota_receiver::is_active /
  ; is_busy) and skips any byte starting an OTA frame. Use a serial monitor for
  ; screen testing; do not drive the OTA tool and type commands at the same time.
  -D ORI_DEBUG_SERIAL
  ; ── Logging toggle ─────────────────────────────────────────────────────────n─
  ; All firmware log output goes through LOG() in include/ori_log.h.
  ; Comment out the line below to silence every LOG() call with zero overhead.
  -D ORI_LOG_ENABLED=1
  ; LVGL 9 picks up lv_conf.h via LV_CONF_INCLUDE_SIMPLE → #include "lv_conf.h"
  ; which resolves through -I include below. LV_CONF_PATH is NOT used because
  ; LVGL 9 checks LV_CONF_PATH before LV_CONF_INCLUDE_SIMPLE, and the raw path
  ; macro expansion fails the preprocessor #include on Windows.
  -D LV_CONF_INCLUDE_SIMPLE
  ; Font sources use #include "lvgl.h" — required for PlatformIO's include layout.
  -D LV_LVGL_H_INCLUDE_SIMPLE
  ; M5: NimBLE config — disable BLE 5 extended advertising to save ~8 KB SRAM.
  ; CONFIG_BT_NIMBLE_EXT_ADV is not needed for Ori's simple dual-peripheral use case.
  -D CONFIG_BT_NIMBLE_EXT_ADV=0
  ; Increase NimBLE host-task stack from the 4096-byte default. After a power
  ; cycle both bonded peers reconnect simultaneously; each CCCD subscription from
  ; Orion triggers ble_store_nvs_write on the host-task stack (nvs_open → set →
  ; commit → close) while DLE + conn-param updates are also in flight. 4096 bytes
  ; overflows by the 3rd CCCD write → xQueueSemaphoreTake assert (first crash).
  -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=16384
  ; CCCD pool size. nimconfig.h default is 8 (via #ifndef guard). Raised to 16
  ; for 2× headroom: 4 NOTIFY chars (0002, 0008, 000A, 000B) × 2 bonded peers
  ; = 8 slots needed. 000D MediaMetadata previously had NOTIFY set, pushing the
  ; count to 5 chars × 2 peers = 10, but 000D's NOTIFY was removed (see
  ; gatt_server.cpp) because Ori never notifies on that characteristic and the
  ; Windows WinRT stack auto-subscribes to all NOTIFY chars, triggering a 5th
  ; bonded NVS write that caused transient SRAM exhaustion → LoadProhibited crash.
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=16
  ; Move NimBLE MSYS packet pool + transport pools (ACL, EVT, CMD) from internal
  ; SRAM to PSRAM. nimconfig.h defaults to CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL
  ; (via #ifndef guard) which forces all nimble_platform_mem_calloc() calls to
  ; MALLOC_CAP_INTERNAL|MALLOC_CAP_8BIT — consuming ~16.5 KB of internal SRAM.
  ; On bonded reconnect, ble_store_nvs_write() fires 4× (once per NOTIFY char) on
  ; the NimBLE host task; each nvs_open() allocates ~8 KB of internal SRAM for NVS
  ; page state, and the BT controller simultaneously needs 259 bytes of internal
  ; SRAM for HCI buffers. The combined pressure exhausts internal SRAM →
  ; "BLE_INIT: Malloc failed" → NimBLE host state corruption → LoadProhibited
  ; crash (EXCVADDR/A7 = 0xe0ffd8ff) in prvNotifyQueueSetContainer.
  ; EXTERNAL mode routes nimble_platform_mem_calloc → MALLOC_CAP_SPIRAM, freeing
  ; ~16.5 KB of internal SRAM. NimBLE host mbufs are accessed in task context only
  ; (VHCI transport, no direct DMA), so PSRAM placement is safe on ESP32-S3.
  -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
  ; M5: ArduinoCBOR header resolution.
  -D ARDUINO_ARCH_ESP32
  -I include
  -I include/ble
  -I include/widgets
  -I include/screens
  ; Route GDMA HAL functions through IRAM wrappers (gdma_iram_fix.cpp).
  ; gdma_hal_append / gdma_hal_reset / gdma_hal_start_with_desc live in
  ; libhal.a (flash) but are called from BLE + LCD_CAM GDMA ISR context.
  ; During NVS/LittleFS writes the MSPI ICache is disabled — any flash
  ; fetch in that window panics with EXCCAUSE 0x7. --wrap intercepts all
  ; link-time call sites and redirects to the IRAM __wrap_* functions.
  -Wl,--wrap=gdma_hal_append
  -Wl,--wrap=gdma_hal_reset
  -Wl,--wrap=gdma_hal_start_with_desc

; Patch lv_blend_helium.S before every build — the ARM Helium SIMD assembly
; cannot be assembled by the Xtensa toolchain. The script replaces the file
; with a no-op stub automatically so the fix survives branch switches that
; cause PlatformIO to reinstall the libdeps from the registry.
extra_scripts = pre:scripts/patch_lvgl_helium.py

lib_deps =
  lvgl/lvgl@9.5.0
  ; GFX Library for Arduino 1.5+ requires Arduino-ESP32 3.x (provided by the
  ; pioarduino platform above). LVGL uses direct render mode into the PSRAM
  ; framebuffer; bounce_buffer_size_px is set to 0 (disabled).
  moononournation/GFX Library for Arduino@^1.6.0
  ; M5: BLE stack. NimBLE-Arduino saves ~40 KB SRAM vs stock Arduino BLE.
  h2zero/NimBLE-Arduino@2.5.0
  ; M5: CBOR codec for all structured BLE payloads.
  ; sgoudsme/tinycbor 0.6.2 — Intel's tinycbor packaged for PlatformIO.
  sgoudsme/tinycbor@^0.6.2

