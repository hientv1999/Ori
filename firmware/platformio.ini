; Ori firmware — PlatformIO project
; Target: Waveshare ESP32-S3 Touch LCD 4.3" (ESP32-S3, 16 MB flash, 8 MB PSRAM).
; Framework: Arduino ONLY. Do not add ESP-IDF APIs.

[platformio]
default_envs = ori

[env:ori]
; pioarduino fork ships Arduino-ESP32 3.x, required by Arduino_GFX 1.5+ which
; in turn unlocks the bounce_buffer_size_px parameter on Arduino_ESP32RGBPanel.
; That parameter is the canonical fix for the PSRAM-bandwidth color artifacts
; (G-channel mid-tone loss, left-edge pixel noise) seen on this Waveshare board.
platform           = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board              = esp32-s3-devkitc-1
framework          = arduino
monitor_speed      = 115200
upload_speed       = 921600

; 16 MB flash, OPI PSRAM (8 MB), Arduino-on-S3 with PSRAM enabled.
board_build.flash_size           = 16MB
board_upload.flash_size          = 16MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = partitions.csv

build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  ; M4 debug: serial key cycler enabled — press '?' in the serial monitor for the keymap.
  -D ORI_DEBUG_SERIAL
  ; LVGL picks up our lv_conf.h from firmware/include/ via these flags.
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
  ; Our extended Montserrat font sources use #include "lvgl.h" instead of
  ; "lvgl/lvgl.h" when this is set — required for PlatformIO's include layout.
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I include
  -I include/widgets
  -I include/screens

lib_deps =
  lvgl/lvgl@^8.3.11
  ; GFX Library for Arduino 1.5+ requires Arduino-ESP32 3.x (provided by the
  ; pioarduino platform above) and exposes the bounce_buffer_size_px parameter
  ; we need to fix PSRAM-bandwidth color artifacts on this Waveshare panel.
  moononournation/GFX Library for Arduino@^1.6.0

