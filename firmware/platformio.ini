; Ori firmware — PlatformIO project
; Target: Waveshare ESP32-S3 Touch LCD 4.3" (ESP32-S3, 16 MB flash, 8 MB PSRAM).
; Framework: Arduino ONLY. Do not add ESP-IDF APIs.

[platformio]
default_envs = ori

[env:ori]
; pioarduino fork ships Arduino-ESP32 3.x, required by Arduino_GFX 1.5+ which
; in turn unlocks the bounce_buffer_size_px parameter on Arduino_ESP32RGBPanel.
; That parameter is the canonical fix for the PSRAM-bandwidth color artifacts
; (G-channel mid-tone loss, left-edge pixel noise) seen on this Waveshare board.
platform           = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board              = esp32-s3-devkitc-1
framework          = arduino
monitor_speed      = 115200
upload_speed       = 921600

; 16 MB flash, OPI PSRAM (8 MB), Arduino-on-S3 with PSRAM enabled.
board_build.flash_size           = 16MB
board_upload.flash_size          = 16MB
board_build.arduino.memory_type  = qio_opi
board_build.partitions           = partitions.csv

build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  ; M4 debug: serial key cycler — press '?' in the serial monitor for the keymap.
  ; Shares the USB CDC port with the OTA receiver, so screen_manager::poll_serial
  ; is gated off whenever an OTA is active/mid-frame (ota_receiver::is_active /
  ; is_busy) and skips any byte starting an OTA frame. Use a serial monitor for
  ; screen testing; do not drive the OTA tool and type commands at the same time.
  ; -D ORI_DEBUG_SERIAL
  ; ── Logging toggle ─────────────────────────────────────────────────────────n─
  ; All firmware log output goes through LOG() in include/ori_log.h.
  ; Comment out the line below to silence every LOG() call with zero overhead.
  -D ORI_LOG_ENABLED=1
  ; LVGL 9 picks up lv_conf.h via LV_CONF_INCLUDE_SIMPLE → #include "lv_conf.h"
  ; which resolves through -I include below. LV_CONF_PATH is NOT used because
  ; LVGL 9 checks LV_CONF_PATH before LV_CONF_INCLUDE_SIMPLE, and the raw path
  ; macro expansion fails the preprocessor #include on Windows.
  -D LV_CONF_INCLUDE_SIMPLE
  ; Font sources use #include "lvgl.h" — required for PlatformIO's include layout.
  -D LV_LVGL_H_INCLUDE_SIMPLE
  ; M5: NimBLE config — disable BLE 5 extended advertising to save ~8 KB SRAM.
  ; CONFIG_BT_NIMBLE_EXT_ADV is not needed for Ori's simple dual-peripheral use case.
  -D CONFIG_BT_NIMBLE_EXT_ADV=0
  ; Increase NimBLE host-task stack from the 4096-byte default. After a power
  ; cycle both bonded peers reconnect simultaneously; each CCCD subscription from
  ; Orion triggers ble_store_nvs_write on the host-task stack (nvs_open → set →
  ; commit → close) while DLE + conn-param updates are also in flight. 4096 bytes
  ; overflows by the 3rd CCCD write → xQueueSemaphoreTake assert (first crash).
  ; The later LoadProhibited crash (A7=0xe0ffd8ff, identical across stack sizes)
  ; was heap contamination: freed internal-DRAM JPEG buffer left JFIF SOI bytes
  ; that corrupted an NVS Queue_t field. Fixed in photo_cache.cpp (PSRAM-only JPEG
  ; buffers). 16384 bytes provides headroom for the dual-peer workload.
  -D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=16384
  ; ── NimBLE persisted-CCCD store — ROOT CAUSE of the Orion-drop-on-iPhone-pair
  ; bug (2026-07-11). CONFIG_BT_NIMBLE_MAX_CCCDS is the GLOBAL cap on persisted
  ; CCCD (subscription) records across ALL bonded peers — not per-peer. Default
  ; is 8. Orion subscribes to 9 notify characteristics (Device Status, Sync
  ; Control, Sync Manifest, Keyboard Command, Media Metadata, Device Settings,
  ; Phone Bond Status, ANCS Notification, ANCS Call State — Device Settings was
  ; added 2026-07-13 for live signal_bars push, ble-protocol.md §6.4, replacing
  ; a fixed-interval poll on Orion's side; ANCS Notification/Call State are what
  ; originally pushed the count from 6 to 8). When the iPhone then bonds (Setup
  ; Step 4 / runtime re-pair), NimBLE persists the subscription the iPhone made
  ; before bonding as one more record → store overflow →
  ; ble_store_util_status_rr() evicts the oldest bonded peer that isn't the one
  ; being stored (ble_gap_unpair_oldest_except) — i.e. ORION: its LTK/IRK are
  ; deleted from NimBLE's bond store and its live connection is terminated
  ; (the observed "peer disconnected handle=1 reason=534" right after
  ; "iPhone bonded"). Ori's app-level NVS slot still says "Orion bonded", so
  ; every Windows reconnect comes up, fails encryption (LTK now missing on
  ; Ori's side only), and is dropped by Windows (reason=531) — unrecoverable
  ; without a factory reset, and Orion's stale-bond fallback (ble-protocol.md
  ; §7.1) eventually sends the app back to first-run setup.
  ; RULE: every new notify characteristic Orion subscribes to consumes one more
  ; persisted CCCD slot — keep this ≥ total subscriptions across both bonded
  ; peers, with headroom. 24 = 2 peers × 9 (current count) with room to grow
  ; (~24 B RAM each; negligible).
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=24
  ; NimBLE request-pool sizing for two concurrent connections — defaults are 1
  ; each, sized for a single link. With Orion + iPhone connecting/pairing
  ; concurrently, the second concurrent conn-param-update or SM procedure
  ; (pairing / bonded re-encryption) fails (BLE_HS_ENOMEM / EALREADY) and
  ; silently never applies — see ble_manager.cpp onConnect()'s note on the
  ; conn-param pool. These 3 were temporarily removed during the 2026-07
  ; bisection of the Orion-drop-on-iPhone-pair regression; that bug reproduced
  ; without them and root-caused to the CCCD store overflow above, so they are
  ; restored per the bisection plan (not implicated).
  -D MYNEWT_VAL_BLE_GAP_MAX_PENDING_CONN_PARAM_UPDATE=3
  -D MYNEWT_VAL_BLE_SM_MAX_PROCS=2
  -D CONFIG_BT_NIMBLE_L2CAP_COC_MAX_NUM=2
  ; NimBLE-Arduino's own msys_1 mbuf pool (nimconfig.h) defaults to 12 blocks
  ; x 256 B (~3 KB) — every outgoing notify()'s ATT payload is allocated from
  ; this pool (ble_hs_mbuf_from_flat), and it's shared with connection
  ; setup/security-manager/L2CAP traffic, not reserved for notifies. Found
  ; undersized 2026-07: ancs_client.cpp's resync_orion_relay() fires right at
  ; reconnect and can queue up to MAX_ANCS_NOTIFICATIONS=50 chunked
  ; AncsNotification relays back-to-back (a captured log showed 10, several
  ; up to 8 fragments each) — comfortably enough to exhaust 12 blocks even
  ; before pairing/MTU-negotiation's own share is subtracted. The primary fix
  ; is pacing that loop (ancs_client.cpp's ANCS_RESYNC_ITEM_PACING_MS) plus a
  ; bounded retry in notify_chunked() (gatt_server.cpp) — this bump is defense
  ; in depth alongside those, not a substitute: doubling to 24 blocks costs
  ; ~3 KB of internal SRAM (CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL is not
  ; set, so this pool stays off PSRAM), negligible on this board.
  -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
  ; M5: ArduinoCBOR header resolution.
  -D ARDUINO_ARCH_ESP32
  -I include
  -I include/ble
  -I include/widgets
  -I include/screens
  ; Route GDMA HAL functions through IRAM wrappers (gdma_iram_fix.cpp).
  ; gdma_hal_append / gdma_hal_reset / gdma_hal_start_with_desc live in
  ; libhal.a (flash) but are called from BLE + LCD_CAM GDMA ISR context.
  ; During NVS/LittleFS writes the MSPI ICache is disabled — any flash
  ; fetch in that window panics with EXCCAUSE 0x7. --wrap intercepts all
  ; link-time call sites and redirects to the IRAM __wrap_* functions.
  -Wl,--wrap=gdma_hal_append
  -Wl,--wrap=gdma_hal_reset
  -Wl,--wrap=gdma_hal_start_with_desc

; Patch lv_blend_helium.S before every build — the ARM Helium SIMD assembly
; cannot be assembled by the Xtensa toolchain. The script replaces the file
; with a no-op stub automatically so the fix survives branch switches that
; cause PlatformIO to reinstall the libdeps from the registry.
extra_scripts = pre:scripts/patch_lvgl_helium.py

lib_deps =
  lvgl/lvgl@9.5.0
  ; GFX Library for Arduino 1.5+ requires Arduino-ESP32 3.x (provided by the
  ; pioarduino platform above). LVGL uses direct render mode into the PSRAM
  ; framebuffer; bounce_buffer_size_px is set to 0 (disabled).
  moononournation/GFX Library for Arduino@^1.6.0
  ; M5: BLE stack. NimBLE-Arduino saves ~40 KB SRAM vs stock Arduino BLE.
  h2zero/NimBLE-Arduino@2.5.0
  ; M5: CBOR codec for all structured BLE payloads.
  ; sgoudsme/tinycbor 0.6.2 — Intel's tinycbor packaged for PlatformIO.
  sgoudsme/tinycbor@^0.6.2

