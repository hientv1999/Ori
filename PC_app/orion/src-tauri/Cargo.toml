[package]
name = "orion"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools" TEMPORARY DIAGNOSTIC (2026-07): release builds have no way to
# open devtools without this feature, so there's been no visibility into
# what's actually happening in the release-only zero-click bug — right-click
# the panel (or Ctrl+Shift+I) once rebuilt and check the Console tab for
# errors. Remove once the actual cause is confirmed.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
# Native OS toast for the low-battery warning while the panel is hidden
# (commands.rs's show_low_battery_notification) — Windows draws these
# bottom-right by default, no manual positioning needed.
tauri-plugin-notification = "2"
# Native "pick a file" dialog for the Calendar Source XML import
# (commands.rs's import_calendar_xml) — pc-app.md.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
btleplug = "0.12.0"
ciborium = "0.2.2"
sha2 = "0.11.0"
uuid = "1.23.4"
serde_bytes = "0.11.19"
futures = "0.3.32"
tokio-stream = "0.1.18"
base64 = "0.22.1"
# default-features off: the crate's defaults pull in AVIF/AV1 (rav1e/ravif),
# WebP, TIFF, etc. — Windows GSMTC thumbnails are JPEG or PNG in practice
# (BMP kept as a cheap fallback); no need for the rest.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
# Calendar Source (pc-app.md): fetch + parse the Outlook sharing-invitation
# XML and the ICS feed it points at. No Microsoft Graph/OAuth anywhere in
# this app by design — see pc-app.md's "Calendar data" section for why.
reqwest = "0.12"
roxmltree = "0.21"
# "recurrence" pulls in `rrule` transitively (reachable as icalendar::rrule::*).
icalendar = { version = "0.17", features = ["recurrence"] }
# chrono itself DOES need its own direct line despite being transitively
# pulled in above — cargo only lets a crate reference another crate by name
# (`chrono::...`) if it's a direct dependency, not merely present in the
# build graph via icalendar/rrule (confirmed by `cargo check`: "unresolved
# import `chrono`" without this line, even though the icalendar/rrule APIs
# themselves already return/accept chrono types).
chrono = "0.4"
# Local holiday support (holiday.rs, ble-protocol.md §3/§4 char 0013):
# computes Vietnamese Tet (lunar New Year) dates 1970-2100. MIT-licensed,
# range 1901-02-19 to 2101-01-28 — comfortably covers what we need. Chosen
# over hand-rolling astronomical lunisolar math (unlike Easter's simplified
# ecclesiastical approximation, a real lunar/solar-position computation is
# not something to reimplement and self-verify from scratch).
chinese-lunisolar-calendar = "0.2.5"

[target.'cfg(target_os = "windows")'.dependencies]
# 0.62 (bumped from 0.61 2026-07): btleplug 0.12 itself pins `windows = "0.62"`,
# so staying on 0.61 here meant our own WinRT/Win32 call sites and btleplug's
# compiled against two separate copies of the whole windows-rs family
# (windows-core/windows-future/windows-numerics/...). This bump makes our own
# code share btleplug's 0.62 copy instead (confirmed via `cargo tree -i
# windows` — `orion` no longer appears anywhere under the 0.61 subtree). It
# does NOT fully collapse `windows` to one version binary-wide: tauri/wry/tao/
# webview2-com (none of which we control here) still pin `windows = "0.61"`
# transitively, so both 0.61 and 0.62 are still linked into the final binary
# — just as "tauri's stack (0.61) vs. orion+btleplug (0.62)" instead of the
# previous "orion+tauri's stack (0.61) vs. btleplug (0.62)". Fully eliminating
# it would mean bumping tauri/wry/tao themselves, once/if they ship a windows
# 0.62-compatible release — out of scope here. All 15 feature names below are
# unchanged between 0.61 and 0.62 (verified against the published feature
# list) — this was otherwise a pure version bump, no feature renames needed.
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Shutdown",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Input_KeyboardAndMouse",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    # Bluetooth-guard (pc-app.md, ble/bt_radio.rs): real "is the Bluetooth
    # radio switched on" detection. Distinct from Devices_Bluetooth above —
    # toggling Bluetooth off in Windows Settings still leaves the adapter
    # hardware enumerable (btleplug/Devices_Bluetooth would keep reporting it
    # present), so only Devices.Radios' own on/off state is reliable here.
    "Devices_Radios",
    "Foundation",
    "Media_Control",
    "Storage_Streams",
] }
# Must track `windows`'s own windows-core generation (0.3.x here pulls
# windows-core 0.62.x, matching `windows` 0.62 above) — pinning this to the
# old 0.2.1 (windows-core ^0.61) while `windows` itself moved to 0.62 would
# just reintroduce the same duplicate-compile problem one dependency lower,
# for windows-core specifically. As of windows-future 0.3.2, `windows`'s own
# default "std" feature already forwards to "windows-future/std" (unlike
# 0.61, where it didn't — hence this was originally added as a workaround);
# kept explicit anyway so `IAsyncOperation<T>: IntoFuture` (needed for
# `.await` on WinRT async calls, `media.rs`/`pairing.rs`) doesn't silently
# depend on `windows`'s default feature set never changing again.
windows-future = { version = "0.3", features = ["std"] }
# Needed explicitly (not just transitively via `windows`) because the
# `#[implement]` macro (`media.rs`'s `VolumeCallback`/`DefaultDeviceListener`
# — the WASAPI volume-change and default-device-change COM callbacks) emits
# generated code that references `windows_core::` paths directly, which only
# resolve if `windows_core` is itself a crate this compilation unit depends
# on — a plain `use windows::core::...` re-export isn't enough for code the
# macro itself writes. Version pinned to match `windows` 0.62's own
# windows-core generation (0.62.x) for the same one-copy reasoning as
# windows-future above.
windows-core = "0.62"

